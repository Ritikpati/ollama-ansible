---
# Creates (or removes) N EC2 servers named "ollama".
# Idempotent: re-running keeps exactly server_count instances with that name.
- name: Provision Ollama servers on AWS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    server_name: ollama
    server_count: 8
    instance_type: t3.xlarge     # 4 vCPU / 16 GB RAM. Use a GPU type (g5.xlarge) for GPU inference.
    volume_size: 100             # GB, models are large
    ssh_cidr: 0.0.0.0/0          # restrict this if you can
    key_name: ""                 # existing EC2 key pair name (required for create)
    server_state: present        # present | absent

  tasks:
    - name: Terminate all servers with this name
      amazon.aws.ec2_instance:
        state: absent
        filters:
          "tag:Name": "{{ server_name }}"
          instance-state-name: [pending, running, stopped, stopping]
        wait: true
      when: server_state == 'absent'

    - name: Create servers
      when: server_state == 'present'
      block:
        - name: Fail if no key pair given
          ansible.builtin.assert:
            that: key_name | length > 0
            fail_msg: "key_name is required"

        - name: Find default VPC
          amazon.aws.ec2_vpc_net_info:
            filters:
              isDefault: "true"
          register: vpc

        - name: Find latest Ubuntu 22.04 AMI
          amazon.aws.ec2_ami_info:
            owners: ["099720109477"]
            filters:
              name: "ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*"
              architecture: x86_64
              state: available
          register: amis

        - name: Create security group
          amazon.aws.ec2_security_group:
            name: "{{ server_name }}-sg"
            description: "SSH access for {{ server_name }} servers"
            vpc_id: "{{ vpc.vpcs[0].vpc_id }}"
            rules:
              - proto: tcp
                ports: [22]
                cidr_ip: "{{ ssh_cidr }}"
          register: sg

        - name: Launch exactly {{ server_count }} servers named {{ server_name }}
          amazon.aws.ec2_instance:
            name: "{{ server_name }}"
            exact_count: "{{ server_count | int }}"
            filters:
              "tag:Name": "{{ server_name }}"
              instance-state-name: [pending, running]
            key_name: "{{ key_name }}"
            instance_type: "{{ instance_type }}"
            image_id: "{{ (amis.images | sort(attribute='creation_date') | last).image_id }}"
            security_groups: ["{{ sg.group_id }}"]
            network:
              assign_public_ip: true
            volumes:
              - device_name: /dev/sda1
                ebs:
                  volume_size: "{{ volume_size | int }}"
                  volume_type: gp3
                  delete_on_termination: true
            tags:
              Name: "{{ server_name }}"
              Project: ollama
            wait: true
